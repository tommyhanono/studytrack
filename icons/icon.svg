<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#0f172a"/>
  <!-- Open book -->
  <rect x="96" y="160" width="148" height="192" rx="8" fill="#d4a843"/>
  <rect x="268" y="160" width="148" height="192" rx="8" fill="#3b82f6"/>
  <rect x="236" y="152" width="40" height="208" rx="4" fill="#1e293b"/>
  <!-- Book spine line -->
  <rect x="252" y="152" width="8" height="208" rx="2" fill="#94a3b8"/>
  <!-- Lines on left page -->
  <rect x="116" y="200" width="108" height="8" rx="4" fill="#0f172a" opacity="0.4"/>
  <rect x="116" y="220" width="88" height="8" rx="4" fill="#0f172a" opacity="0.4"/>
  <rect x="116" y="240" width="100" height="8" rx="4" fill="#0f172a" opacity="0.4"/>
  <rect x="116" y="260" width="76" height="8" rx="4" fill="#0f172a" opacity="0.4"/>
  <!-- Lines on right page -->
  <rect x="288" y="200" width="108" height="8" rx="4" fill="#0f172a" opacity="0.4"/>
  <rect x="288" y="220" width="88" height="8" rx="4" fill="#0f172a" opacity="0.4"/>
  <rect x="288" y="240" width="100" height="8" rx="4" fill="#0f172a" opacity="0.4"/>
  <rect x="288" y="260" width="76" height="8" rx="4" fill="#0f172a" opacity="0.4"/>
  <!-- Star of David hint on gold page -->
  <text x="170" y="310" font-size="48" text-anchor="middle" fill="#0f172a" opacity="0.5">✦</text>
  <!-- Checkmark on blue page -->
  <text x="342" y="310" font-size="48" text-anchor="middle" fill="#0f172a" opacity="0.5">✓</text>
  <!-- ST letters bottom -->
  <text x="256" y="400" font-size="48" font-family="system-ui,sans-serif" font-weight="700" text-anchor="middle" fill="#f1f5f9" opacity="0.7">ST</text>
</svg>
